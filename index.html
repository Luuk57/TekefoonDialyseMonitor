<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dialyse Smartphone Monitor</title>
  <link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090d16">

  <!-- Firebase SDK's -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col p-4 max-w-md mx-auto justify-between">

  <!-- Bovenkant: Status & Patiënt -->
  <header class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-lg">
    <div>
      <div class="text-[10px] text-slate-400 font-semibold uppercase">Actieve Patiënt</div>
      <div id="phonePatientName" class="text-sm font-extrabold text-emerald-400">Verbinden...</div>
    </div>
    <span class="text-xs px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-400 font-medium">Live ⚡</span>
  </header>

  <!-- Midden: De Countdown Klok -->
  <main class="flex flex-col items-center justify-center my-6 gap-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full text-center shadow-xl flex flex-col items-center">
      <span class="text-xs text-slate-400 font-semibold mb-1">⏱️ Resterende Tijd</span>
      <div id="phoneCountdown" class="text-4xl font-extrabold text-sky-400 tracking-wider mb-2">04:00:00</div>
      <div class="w-full bg-slate-950 rounded-full h-2.5 border border-slate-800 overflow-hidden">
        <div id="phoneProgressBar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <div id="phoneProgressText" class="text-[11px] text-slate-400 mt-2">0% verstreken</div>
    </div>

    <!-- Gewichten Snel Invullen -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-3xl w-full shadow-xl flex flex-col gap-3">
      <h2 class="text-sky-400 font-bold text-xs border-b border-slate-800 pb-2">⚖️ Gewichten & UF Invoeren</h2>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[10px] font-semibold text-slate-400 mb-1">Pre-gewicht (kg)</label>
          <input type="number" step="0.1" id="phonePreWeight" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm font-bold text-center text-sky-400 outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-slate-400 mb-1">Post-gewicht (kg)</label>
          <input type="number" step="0.1" id="phonePostWeight" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-sm font-bold text-center text-emerald-400 outline-none">
        </div>
      </div>

      <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
        <div>
          <span class="text-slate-400 block text-[10px]">Berekend UF Advies:</span>
          <strong id="phoneUfAdvise" class="text-emerald-400 text-sm">0 ml</strong>
        </div>
        <div>
          <span class="text-slate-400 block text-[10px]">Ingestelde UF:</span>
          <strong id="phoneSetUf" class="text-sky-400 text-sm">3800 ml</strong>
        </div>
      </div>

      <button id="phoneSaveBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition cursor-pointer text-xs shadow">
        💾 Wijzigingen Opslaan & Synchroniseren
      </button>
    </div>
  </main>

  <!-- Onderkant: Laatste Bloeddruk -->
  <footer class="bg-slate-900 border border-slate-800 p-3 rounded-2xl text-center text-xs text-slate-400">
    Laatste Bloeddruk: <strong id="phoneBpDisplay" class="text-emerald-400">120 / 80 mmHg</strong>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOj-x4BV4J1rkZ21R29D5KknkTaswWvw",
      authDomain: "tabos-vocht.firebaseapp.com",
      databaseURL: "https://tabos-vocht-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "tabos-vocht",
      storageBucket: "tabos-vocht.appspot.com",
      messagingSenderId: "372380067963",
      appId: "1:372380067963:web:8e57ae65aba2c2afb41ade"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const sessionRef = db.ref('dialyse_actieve_sessie');

    let remoteState = {
      isRunning: false,
      startTimeEpoch: null,
      pausedTimeLeft: 4 * 3600,
      totalDuration: 4 * 3600,
      dryWeight: 109.0
    };

    const phoneCountdown = document.getElementById('phoneCountdown');
    const phoneProgressBar = document.getElementById('phoneProgressBar');
    const phoneProgressText = document.getElementById('phoneProgressText');
    const phonePreWeight = document.getElementById('phonePreWeight');
    const phonePostWeight = document.getElementById('phonePostWeight');
    const phoneUfAdvise = document.getElementById('phoneUfAdvise');
    const phoneSetUf = document.getElementById('phoneSetUf');
    const phoneBpDisplay = document.getElementById('phoneBpDisplay');
    const phonePatientName = document.getElementById('phonePatientName');

    function calculateCurrentLeft() {
      if (!remoteState.isRunning) {
        return remoteState.pausedTimeLeft;
      }
      const elapsedSec = Math.floor((Date.now() - remoteState.startTimeEpoch) / 1000);
      const remaining = remoteState.totalDuration - elapsedSec;
      return Math.max(0, remaining);
    }

    function renderTimer() {
      const timeLeft = calculateCurrentLeft();
      const hours = Math.floor(timeLeft / 3600).toString().padStart(2, '0');
      const minutes = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      
      phoneCountdown.innerText = `${hours}:${minutes}:${seconds}`;

      const elapsed = remoteState.totalDuration - timeLeft;
      const progress = remoteState.totalDuration > 0 ? Math.min(Math.max(elapsed / remoteState.totalDuration, 0), 1) : 0;
      const percent = Math.round(progress * 100);

      phoneProgressBar.style.width = percent + '%';
      phoneProgressText.innerText = percent + '% verstreken';
    }

    setInterval(renderTimer, 200);

    function calculatePhoneUf() {
      const dry = remoteState.dryWeight || 109.0;
      const pre = parseFloat(phonePreWeight.value) || 0;
      const ufKg = (pre - dry + 0.3);
      const ufMl = Math.round(ufKg * 1000);
      phoneUfAdvise.innerText = pre > 0 ? ufMl + ' ml' : '0 ml';
    }

    phonePreWeight.oninput = calculatePhoneUf;

    document.getElementById('phoneSaveBtn').onclick = () => {
      const pre = parseFloat(phonePreWeight.value) || 0;
      const post = parseFloat(phonePostWeight.value) || 0;
      const dry = remoteState.dryWeight || 109.0;
      const calcUf = Math.round((pre - dry + 0.3) * 1000);

      sessionRef.update({
        preWeight: pre,
        postWeight: post,
        calculatedUf: calcUf
      });
      alert('Gegevens succesvol gesynchroniseerd met de hoofdsessie!');
    };

    sessionRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.dryWeight) remoteState.dryWeight = data.dryWeight;
        if (data.preWeight && document.activeElement !== phonePreWeight) {
          phonePreWeight.value = data.preWeight;
          calculatePhoneUf();
        }
        if (data.postWeight && document.activeElement !== phonePostWeight) {
          phonePostWeight.value = data.postWeight;
        }
        if (data.setUf) {
          phoneSetUf.innerText = data.setUf + ' ml';
        }
        if (data.bp) {
          phoneBpDisplay.innerText = data.bp + ' mmHg';
        }
        if (data.totalDuration) remoteState.totalDuration = data.totalDuration;
        if (typeof data.isRunning === 'boolean') remoteState.isRunning = data.isRunning;
        if (typeof data.startTimeEpoch === 'number') remoteState.startTimeEpoch = data.startTimeEpoch;
        if (typeof data.pausedTimeLeft === 'number') remoteState.pausedTimeLeft = data.pausedTimeLeft;

        renderTimer();
      }
    });
  </script>
</body>
</html>
